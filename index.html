<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo da Memória da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFE9A8; --bg2:#FFDF85; --ink:#2B2A4C; --berry:#3D4BA8; --berry2:#2F3B8F;
  --sun:#FFC93C; --coral:#FF7A6B; --leaf:#6FA85A; --card-shadow:0 6px 0 rgba(43,42,76,.18);
  --panel:#FFF8E1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1F2350; --bg2:#262B63; --ink:#FFF4D6; --panel:#2A2F6E; --card-shadow:0 6px 0 rgba(0,0,0,.35); }
}
:root[data-theme="dark"]{ --bg:#1F2350; --bg2:#262B63; --ink:#FFF4D6; --panel:#2A2F6E; --card-shadow:0 6px 0 rgba(0,0,0,.35); }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden;
  background-image:radial-gradient(circle at 12% 18%,var(--bg2) 0 38px,transparent 39px),radial-gradient(circle at 88% 82%,var(--bg2) 0 60px,transparent 61px),radial-gradient(circle at 80% 12%,var(--bg2) 0 22px,transparent 23px);
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;position:relative}

.bar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.round{width:56px;height:56px;border-radius:50%;border:none;background:var(--panel);box-shadow:var(--card-shadow);font-size:26px;display:grid;place-items:center;flex:none}
.round:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,42,76,.18)}
#shelf{flex:1;display:flex;gap:6px;justify-content:center;align-items:center;min-height:56px;flex-wrap:wrap}
.slot{width:46px;height:46px;border-radius:50%;background:var(--panel);opacity:.55;border:3px dashed rgba(127,120,160,.5)}
.slot.got{opacity:1;border:3px solid var(--sun);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.slot svg{width:100%;height:100%;border-radius:50%}

#stage{flex:1;min-height:0;padding:6px 14px 16px;display:grid;place-items:center}
#grid{display:grid;gap:14px;justify-content:center;align-content:center}
.card{border:none;padding:0;background:none;perspective:900px;width:var(--cw);height:calc(var(--cw)*1.2)}
.inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,1.4,.5,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--card-shadow);overflow:hidden}
.back{background:var(--berry);background-image:radial-gradient(rgba(255,255,255,.14) 2px,transparent 3px);background-size:18px 18px;display:grid;place-items:center;border:5px solid var(--berry2)}
.back svg{width:62%;height:auto;animation:twinkle 2.6s ease-in-out infinite}
.front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:5px solid #fff}
.front svg{width:100%;flex:1;min-height:0}
.lbl{font-weight:700;font-size:calc(var(--cw)*.13);padding:2px 0 6px;color:#2B2A4C;line-height:1}
.card.matched .inner{animation:hop .7s ease}
.card.matched .front{border-color:var(--sun)}
.card.wobble .inner{animation:wobble .45s ease}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:var(--bg);z-index:5;text-align:center;overflow-y:auto}
.screen.hidden{display:none}
.hero{display:flex;align-items:flex-end;justify-content:center;gap:2vw;width:min(560px,96vw)}
.hero button{border:none;background:none;padding:0;flex:1}
.hero svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(43,42,76,.15))}
.hero .mid{flex:.85}
.hero button.talk svg{animation:hop .6s ease}
h1{margin:0;font-size:clamp(30px,7vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.5px}
h1 span{display:inline-block}
h1 span:nth-child(odd){transform:rotate(-3deg)}
h1 span:nth-child(even){transform:rotate(2deg)}
.hint{margin:0;font-size:17px;font-weight:500;opacity:.8;max-width:34ch}
.namebox{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
.namebox input{font:inherit;font-size:20px;width:170px;padding:10px 14px;border-radius:16px;border:3px solid var(--berry);background:var(--panel);color:var(--ink);text-align:center}
.levels{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.lvl{border:none;border-radius:24px;padding:14px 22px 12px;font-size:22px;font-weight:700;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);min-width:140px}
.lvl small{display:block;font-size:14px;font-weight:500;opacity:.9}
.lvl:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.l1{background:var(--leaf)} .l2{background:var(--coral)} .l3{background:var(--berry)}

#win h2{margin:0;font-size:clamp(40px,10vw,72px);line-height:1}
#win .hero svg{animation:dance 1s ease-in-out infinite}
#win .hero button:nth-child(2) svg{animation-delay:.2s}
#win .hero button:nth-child(3) svg{animation-delay:.4s}

.confetti{position:fixed;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:20;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes hop{0%,100%{transform:rotateY(180deg) translateY(0)}35%{transform:rotateY(180deg) translateY(-14%) scale(1.06)}65%{transform:rotateY(180deg) translateY(0) scale(.97)}}
.hero button.talk svg{animation-name:hop2}
@keyframes hop2{0%,100%{transform:translateY(0)}40%{transform:translateY(-12%) rotate(-4deg)}}
@keyframes wobble{0%,100%{transform:rotateY(180deg)}30%{transform:rotateY(180deg) rotate(-4deg)}60%{transform:rotateY(180deg) rotate(4deg)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.07) rotate(6deg)}}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10%) rotate(4deg)}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition-duration:.01s!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="round" id="homeBtn" aria-label="Voltar ao início">🏠</button>
    <div id="shelf" aria-label="Pares encontrados"></div>
    <button class="round" id="sndBtn" aria-label="Ligar ou desligar som">🔊</button>
  </header>
  <main id="stage"><div id="grid"></div></main>

  <section class="screen" id="menu">
    <div class="hero" id="heroMenu"></div>
    <h1><span>Jogo</span> <span>da</span> <span>Memória</span><br><span>da</span> <span>Família</span></h1>
    <p class="hint">Toque em cada um para ouvir o nome. Depois escolha um jogo e encontre os pares!</p>
    <label class="namebox">Nome do bebê <input id="nameIn" maxlength="14" placeholder="Neném" autocomplete="off"></label>
    <div class="levels">
      <button class="lvl l1" data-n="2">Fácil<small>2 pares</small></button>
      <button class="lvl l2" data-n="3">Médio<small>3 pares</small></button>
      <button class="lvl l3" data-n="6">Desafio<small>6 pares</small></button>
    </div>
  </section>

  <section class="screen hidden" id="win">
    <div class="hero" id="heroWin"></div>
    <h2>Parabéns!</h2>
    <div class="levels">
      <button class="lvl l2" id="againBtn">Jogar de novo</button>
      <button class="lvl l3" id="menuBtn">Trocar jogo</button>
    </div>
  </section>
</div>

<script>
/* ---------- Personagens (SVG 200x200) ---------- */
const heart=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 3C0-2-7-2-7 3C-7 7 0 11 0 12C0 11 7 7 7 3C7-2 0-2 0 3Z" fill="${c}"/>`;
const eye=(x,y,rx,ry)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#33201A"/><circle cx="${x+2}" cy="${y-3}" r="${rx*.38}" fill="#fff"/>`;

function mamae(){
  const S='#F5CBB0',H='#3E261C';
  let dress='';
  [[70,170],[118,182],[92,196],[136,164],[60,192]].forEach(([x,y])=>dress+=heart(x,y,1.1,'#E0353D'));
  [[84,172],[104,166],[126,192],[72,184],[146,182],[100,184]].forEach(([x,y])=>dress+=`<circle cx="${x}" cy="${y}" r="3.2" fill="#F7B8C4"/><circle cx="${x}" cy="${y}" r="1.2" fill="#E9798F"/>`);
  return `
  <circle cx="100" cy="36" r="21" fill="${H}"/>
  <path d="M84 132h32v18c0 8-32 8-32 0z" fill="${S}"/>
  <path d="M44 205C46 162 66 148 100 148C134 148 154 162 156 205Z" fill="#AEBB6E"/>
  <path d="M78 150Q100 166 122 150" stroke="#93A257" stroke-width="3" fill="none"/>
  <path d="M74 150 l-4 16 M126 150 l4 16" stroke="#93A257" stroke-width="2" stroke-dasharray="3 3"/>
  ${dress}
  <ellipse cx="54" cy="96" rx="7" ry="10" fill="${S}"/><ellipse cx="146" cy="96" rx="7" ry="10" fill="${S}"/>
  <ellipse cx="100" cy="92" rx="47" ry="50" fill="${S}"/>
  <path d="M52 96C46 50 74 40 100 40C126 40 154 50 148 96C142 72 128 60 100 60C72 60 58 72 52 96Z" fill="${H}"/>
  <path d="M68 80q11-7 22-1M110 79q11-6 22 1" stroke="${H}" stroke-width="4" fill="none" stroke-linecap="round"/>
  ${eye(80,95,7,8)}${eye(120,95,7,8)}
  <path d="M71 90l-4-3M129 90l4-3" stroke="#33201A" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#C98A68" opacity=".75"><circle cx="68" cy="108" r="1.7"/><circle cx="75" cy="112" r="1.5"/><circle cx="63" cy="113" r="1.5"/><circle cx="92" cy="106" r="1.4"/><circle cx="108" cy="106" r="1.4"/><circle cx="125" cy="112" r="1.5"/><circle cx="132" cy="108" r="1.7"/><circle cx="137" cy="113" r="1.5"/></g>
  <ellipse cx="66" cy="117" rx="9" ry="6" fill="#F49A9A" opacity=".5"/><ellipse cx="134" cy="117" rx="9" ry="6" fill="#F49A9A" opacity=".5"/>
  <path d="M100 100q-5 10 0 12" stroke="#D69A78" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M79 121Q100 145 121 121Z" fill="#8B2E3A"/>
  <path d="M82 122Q100 129 118 122L117 126Q100 133 83 126Z" fill="#fff"/>`;
}
function papai(){
  const S='#E2A982',H='#241813',B='#1F1511';
  return `
  <path d="M38 205C40 160 64 144 100 144C136 144 160 160 162 205Z" fill="#26262B"/>
  <path d="M74 146L100 174L126 146L114 141L100 158L86 141Z" fill="#3A3A44"/>
  <circle cx="100" cy="182" r="2.6" fill="#55555F"/><circle cx="100" cy="194" r="2.6" fill="#55555F"/>
  <ellipse cx="55" cy="92" rx="7" ry="10" fill="${S}"/><ellipse cx="145" cy="92" rx="7" ry="10" fill="${S}"/>
  <ellipse cx="100" cy="88" rx="45" ry="49" fill="${S}"/>
  <path d="M54 88C48 44 76 32 100 32C126 32 152 44 146 88C142 64 132 56 118 58C104 50 84 54 72 60C62 64 56 74 54 88Z" fill="${H}"/>
  <path d="M55 88C53 150 80 162 100 162C120 162 147 150 145 88C140 108 132 116 122 118C112 112 88 112 78 118C68 116 60 108 55 88Z" fill="${B}"/>
  <path d="M68 76q12-8 24-2M108 74q12-6 24 2" stroke="${H}" stroke-width="6" fill="none" stroke-linecap="round"/>
  ${eye(81,89,6,7)}${eye(119,89,6,7)}
  <path d="M73 97q8 4 15 0M112 97q8 4 15 0" stroke="#BE8461" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M100 92q-6 13 0 16q4 0 6-2" stroke="#B9805C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M82 125Q100 144 118 125Z" fill="#7A2A2A"/>
  <path d="M85 126Q100 132 115 126L114 129Q100 136 86 129Z" fill="#fff"/>
  <path d="M76 121Q89 109 100 116Q111 109 124 121Q111 117 100 122Q89 117 76 121Z" fill="${B}"/>`;
}
function bebe(){
  const S='#F9D6C1',H='#9A6B47',O='#D9CBB2';
  return `
  <path d="M50 205C52 164 70 152 100 152C130 152 148 164 150 205Z" fill="#FBF6EC"/>
  <path d="M70 176h60v30h-60z" fill="${O}"/>
  <path d="M70 178L64 154L75 152L82 178ZM130 178L136 154L125 152L118 178Z" fill="${O}"/>
  <circle cx="77" cy="180" r="4.5" fill="#C08A4E"/><circle cx="123" cy="180" r="4.5" fill="#C08A4E"/>
  <path d="M82 152Q91 166 100 156Q109 166 118 152Z" fill="#fff" stroke="#E6DCC8" stroke-width="2"/>
  <ellipse cx="50" cy="98" rx="8" ry="11" fill="${S}"/><ellipse cx="150" cy="98" rx="8" ry="11" fill="${S}"/>
  <circle cx="100" cy="94" r="52" fill="${S}"/>
  <path d="M66 58C78 38 122 36 134 58C120 48 110 52 100 47C90 53 80 50 66 58Z" fill="${H}"/>
  <path d="M100 47q7-13-3-18" stroke="${H}" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M71 83q9-5 18 0M111 83q9-5 18 0" stroke="#C49A78" stroke-width="3" fill="none" stroke-linecap="round"/>
  ${eye(80,98,8,9)}${eye(120,98,8,9)}
  <ellipse cx="65" cy="116" rx="11" ry="8" fill="#F59B9B" opacity=".55"/><ellipse cx="135" cy="116" rx="11" ry="8" fill="#F59B9B" opacity=".55"/>
  <ellipse cx="100" cy="110" rx="4.5" ry="3.2" fill="#EDB79C"/>
  <path d="M86 122Q100 143 114 122Z" fill="#B23A48"/>
  <ellipse cx="100" cy="133" rx="7" ry="4" fill="#F28B9A"/>`;
}
function familia(){
  return `
  ${heart(100,18,2.2,'#F0546A')}${heart(62,30,1.3,'#F7A1B0')}${heart(138,30,1.3,'#F7A1B0')}
  <g transform="translate(-14 60) scale(.62)">${papai()}</g>
  <g transform="translate(90 64) scale(.62)">${mamae()}</g>
  <g transform="translate(46 84) scale(.58)">${bebe()}</g>`;
}
function carro(){
  return `
  <ellipse cx="100" cy="160" rx="78" ry="8" fill="rgba(0,0,0,.1)"/>
  <path d="M26 132Q28 98 58 94L76 68Q82 60 94 60H130Q142 60 148 70L162 94Q178 98 178 124V138H26Z" fill="#FF7A6B"/>
  <path d="M82 72Q86 68 94 68H108V94H68Z" fill="#BFE6F5"/>
  <path d="M116 68H130Q137 68 141 74L153 94H116Z" fill="#BFE6F5"/>
  <path d="M112 66V136" stroke="#E25E50" stroke-width="3"/>
  <circle cx="170" cy="110" r="6" fill="#FFE38A"/><rect x="26" y="108" width="10" height="10" rx="3" fill="#E0353D"/>
  <circle cx="64" cy="140" r="19" fill="#2E2E36"/><circle cx="64" cy="140" r="8" fill="#D8D8E0"/>
  <circle cx="146" cy="140" r="19" fill="#2E2E36"/><circle cx="146" cy="140" r="8" fill="#D8D8E0"/>
  <path d="M120 112h10" stroke="#E25E50" stroke-width="4" stroke-linecap="round"/>`;
}
function coracao(){
  return `
  <path d="M100 172C40 132 28 102 28 78C28 52 50 36 70 36C86 36 96 46 100 56C104 46 114 36 130 36C150 36 172 52 172 78C172 102 160 132 100 172Z" fill="#F0546A"/>
  <ellipse cx="72" cy="66" rx="12" ry="7" fill="#fff" opacity=".35" transform="rotate(-30 72 66)"/>
  ${eye(82,92,7,8)}${eye(118,92,7,8)}
  <ellipse cx="70" cy="108" rx="9" ry="6" fill="#FFB3BF"/><ellipse cx="130" cy="108" rx="9" ry="6" fill="#FFB3BF"/>
  <path d="M88 110Q100 124 112 110" stroke="#7A1E2C" stroke-width="4" fill="none" stroke-linecap="round"/>`;
}
const svg=(inner,bg)=>`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${bg?`<rect width="200" height="200" fill="${bg}"/>`:''}${inner}</svg>`;
const STAR=`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6L62 36L94 38L69 58L77 90L50 72L23 90L31 58L6 38L38 36Z" fill="#FFC93C" stroke="#F2A900" stroke-width="3" stroke-linejoin="round"/><circle cx="42" cy="50" r="3.5" fill="#2B2A4C"/><circle cx="58" cy="50" r="3.5" fill="#2B2A4C"/><path d="M43 59q7 6 14 0" stroke="#2B2A4C" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;

/* ---------- Dados ---------- */
let babyName='';
try{babyName=localStorage.getItem('mem_nome')||''}catch(e){}
const nm=()=>babyName.trim()||'Neném';
const CARDS={
  papai:{draw:papai,bg:'#BFE3F2',label:()=> 'Papai',say:()=> 'Papai!'},
  mamae:{draw:mamae,bg:'#FFD6DE',label:()=> 'Mamãe',say:()=> 'Mamãe!'},
  bebe:{draw:bebe,bg:'#FFEBA6',label:nm,say:()=> nm()+'!'},
  familia:{draw:familia,bg:'#D9EFC4',label:()=> 'Família',say:()=> 'A família toda!'},
  carro:{draw:carro,bg:'#FFE1CC',label:()=> 'Carro',say:()=> 'Carro! Vrum, vrum!'},
  coracao:{draw:coracao,bg:'#FFE4EC',label:()=> 'Coração',say:()=> 'Coração! Muito amor!'}
};

/* ---------- Som e voz ---------- */
let soundOn=true,ac=null;
function tone(f,d,w=0,type='sine',v=.18){
  if(!soundOn)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+w,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
const sFlip=()=>{tone(520,.12,0,'triangle');tone(780,.1,.05,'triangle')};
const sMatch=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,i*.09,'triangle',.2));
const sMiss=()=>{tone(392,.18,0,'sine',.12);tone(330,.22,.12,'sine',.12)};
const sWin=()=>[523,523,784,784,880,880,784,698,659,587,523].forEach((f,i)=>tone(f,.26,i*.2,'triangle',.18));
function speak(t,delay=0){
  if(!soundOn||!('speechSynthesis' in window))return;
  setTimeout(()=>{
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.9;u.pitch=1.25;
      const v=speechSynthesis.getVoices().find(v=>(v.lang||'').toLowerCase().startsWith('pt-br'))||speechSynthesis.getVoices().find(v=>(v.lang||'').toLowerCase().startsWith('pt'));
      if(v)u.voice=v;speechSynthesis.speak(u);
    }catch(e){}
  },delay);
}
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}

/* ---------- Confete ---------- */
const COLORS=['#FF7A6B','#FFC93C','#6FA85A','#3D4BA8','#F0546A','#5BC0EB'];
function burst(x,y,n=24){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='confetti';
    const a=Math.random()*Math.PI*2,d=60+Math.random()*140;
    s.style.left=x+'px';s.style.top=y+'px';s.style.background=COLORS[i%COLORS.length];
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+60+'px');s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1200);
  }
}
const center=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};

/* ---------- Telas ---------- */
const $=id=>document.getElementById(id);
function heroInto(el){
  el.innerHTML='';
  [['papai',''],['bebe','mid'],['mamae','']].forEach(([k,c])=>{
    const b=document.createElement('button');b.className=c;b.setAttribute('aria-label',CARDS[k].label());
    b.innerHTML=svg(CARDS[k].draw());
    b.onclick=()=>{b.classList.remove('talk');void b.offsetWidth;b.classList.add('talk');sFlip();speak(CARDS[k].say());};
    el.appendChild(b);
  });
}
heroInto($('heroMenu'));heroInto($('heroWin'));
$('nameIn').value=babyName;
$('nameIn').addEventListener('input',e=>{babyName=e.target.value;try{localStorage.setItem('mem_nome',babyName)}catch(err){}});

/* ---------- Jogo ---------- */
let deck=[],first=null,lock=true,found=0,pairs=0,lastN=2;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function facesFor(n){
  if(n===2)return['bebe',Math.random()<.5?'papai':'mamae'];
  if(n===3)return['papai','mamae','bebe'];
  return['papai','mamae','bebe','familia','carro','coracao'];
}
function start(n){
  lastN=n;$('menu').classList.add('hidden');$('win').classList.add('hidden');
  const faces=facesFor(n);pairs=faces.length;found=0;first=null;
  deck=shuffle([...faces,...faces]);
  const shelf=$('shelf');shelf.innerHTML='';
  faces.forEach(()=>{const s=document.createElement('div');s.className='slot';shelf.appendChild(s)});
  const grid=$('grid');grid.innerHTML='';
  deck.forEach((k,i)=>{
    const c=CARDS[k],b=document.createElement('button');
    b.className='card';b.dataset.k=k;b.setAttribute('aria-label','Carta '+(i+1));
    b.innerHTML=`<div class="inner"><div class="face back">${STAR}</div><div class="face front" style="background:${c.bg}">${svg(c.draw())}<span class="lbl">${c.label()}</span></div></div>`;
    b.onclick=()=>pick(b);grid.appendChild(b);
  });
  layout();
  lock=true;
  setTimeout(()=>grid.querySelectorAll('.card').forEach(c=>c.classList.add('flipped')),350);
  setTimeout(()=>{grid.querySelectorAll('.card').forEach(c=>c.classList.remove('flipped'));lock=false;},n===6?2600:1900);
  speak('Vamos brincar! Olha todo mundo!',200);
}
function pick(b){
  if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;
  b.classList.add('flipped');sFlip();speak(CARDS[b.dataset.k].say());
  if(!first){first=b;return;}
  const a=first;first=null;lock=true;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{
      a.classList.add('matched');b.classList.add('matched');sMatch();
      burst(...center(a),18);burst(...center(b),18);
      const slot=$('shelf').children[found];slot.classList.add('got');slot.innerHTML=svg(CARDS[a.dataset.k].draw(),CARDS[a.dataset.k].bg);
      found++;speak('Achou! '+CARDS[a.dataset.k].say(),300);
      if(found===pairs)setTimeout(win,1400);else lock=false;
    },550);
  }else{
    setTimeout(()=>{a.classList.add('wobble');b.classList.add('wobble');sMiss();},700);
    setTimeout(()=>{a.classList.remove('flipped','wobble');b.classList.remove('flipped','wobble');lock=false;},1500);
  }
}
function win(){
  $('win').classList.remove('hidden');sWin();speak('Parabéns! Muito bem, '+nm()+'!',300);
  const w=innerWidth,h=innerHeight;
  [0,300,600,900].forEach(t=>setTimeout(()=>burst(Math.random()*w,h*.3+Math.random()*h*.3,30),t));
}
function layout(){
  const n=deck.length;if(!n)return;
  const st=$('stage'),cs=getComputedStyle(st);
  const W=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const H=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const gap=14;let best={s:0,c:1};
  for(let c=1;c<=n;c++){
    const r=Math.ceil(n/c);
    const s=Math.min((W-gap*(c-1))/c,((H-gap*(r-1))/r)/1.2);
    if(s>best.s)best={s,c};
  }
  const s=Math.min(best.s,260);
  const grid=$('grid');grid.style.gridTemplateColumns=`repeat(${best.c},${s}px)`;grid.style.setProperty('--cw',s+'px');
}
addEventListener('resize',layout);

document.querySelectorAll('.lvl[data-n]').forEach(b=>b.onclick=()=>{sFlip();start(+b.dataset.n)});
$('againBtn').onclick=()=>start(lastN);
$('menuBtn').onclick=$('homeBtn').onclick=()=>{try{speechSynthesis.cancel()}catch(e){};$('win').classList.add('hidden');$('menu').classList.remove('hidden');};
$('sndBtn').onclick=()=>{soundOn=!soundOn;$('sndBtn').textContent=soundOn?'🔊':'🔇';if(!soundOn){try{speechSynthesis.cancel()}catch(e){}}else sFlip();};
</script>
</body>
</html>
